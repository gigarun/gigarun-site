server {
    absolute_redirect off;

    # En-tetes de securite (poses le 2026-09-25 : le diagnostic cybersecure.re notait ce site F, 0 en-tete sur 7).
    # Poses au niveau server : aucun location n utilise add_header, ils s appliquent donc partout.
    # HSTS sans includeSubDomains ni preload (sous-domaines non tous en HTTPS).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP en mode REPORT-ONLY : elle n'empeche rien, le navigateur signale seulement les violations dans sa console.
    # Etablie le 2026-09-26 a partir des 142 pages du sitemap : 'unsafe-inline' reste necessaire pour les scripts
    # (2 scripts inline Astro sur toutes les pages : bandeau cookies et accessibilite, + 13 scripts et 33 attributs onclick
    # dans 5 pages de guides) et pour les styles (3000+ attributs style). Origines externes reellement utilisees :
    # Cloudflare Web Analytics (injecte par Cloudflare), iframes rtsp.me (2 pages), carte Google Maps creee au clic
    # sur /contact/. Le formulaire envoie vers gigarun.re lui-meme (connect-src 'self').
    # POUR IMPOSER LA POLITIQUE : remplacer "Content-Security-Policy-Report-Only" par "Content-Security-Policy",
    # apres avoir verifie la console du navigateur sur quelques pages (accueil, /contact/ en cliquant sur la carte,
    # /videosurveillance-controle-acces/, un guide interactif). Pour un script-src sans 'unsafe-inline' : hash des
    # scripts inline a generer a chaque build + refactor des onclick des 5 pages de guides.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; frame-src https://rtsp.me https://maps.google.com https://www.google.com; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    # Fichiers buildes par Astro dans /_astro/ : noms hashes -> cache long + immutable.
    # expires genere a la fois Cache-Control ET Expires (Pingdom/YSlow verifient
    # encore ce dernier a l'ancienne, meme si Cache-Control seul suffit aux
    # navigateurs modernes) ; immutable ajoute en plus car les noms sont hashes.
    location ^~ /_astro/ {
        root   /usr/share/nginx/html;
        expires 1y;
    }

    # Assets statiques hors build (public/) : pas de hash dans le nom -> cache modere.
    location ~* \.(?:mp4|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
        root   /usr/share/nginx/html;
        expires 30d;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
